name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pip install -e ".[dev]"
    - name: Run tests with coverage
      run: |
        python -m pytest tests/ --cov=src/yi_jing_agent/ --cov-report=term-missing --cov-fail-under=90 -v
    - name: Lint
      run: |
        pycodestyle src/ --max-line-length=100 --ignore=E302,W391

  benchmark:
    runs-on: ubuntu-latest
    needs: test  # Only run benchmarks if tests pass

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        pip install -e ".[dev]"
    - name: Run benchmarks
      run: |
        python -m pytest tests/benchmarks/ --benchmark-only --benchmark-json=benchmark_results.json -v
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: benchmark_results.json
